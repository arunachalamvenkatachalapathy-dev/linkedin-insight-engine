<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    .brand-pill { background-color: var(--bofu-color); box-shadow: 0 0 25px var(--bofu-glow); }
    .stage-badge { color: var(--bofu-badge); }
    .card-box { border-color: var(--bofu-badge); box-shadow: 0 0 35px var(--bofu-glow); }
    .card-tag { color: var(--bofu-badge); }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="brand-pill">ECOPULSE</div>
    <div class="stage-badge">BOTTOM OF FUNNEL | AUDIT PROOF & CASE STUDY</div>
  </div>

  <div class="title-container">
    <h1 class="main-title">{{ headline }}</h1>
  </div>

  <div class="card-box">
    <div class="card-tag">BOTTOM OF FUNNEL  |  S-A-M-R FRAMEWORK CASE STUDY</div>
    <p class="card-fact">{{ fact_text }}</p>
  </div>

  <div class="footer-bar">
    <div class="frameworks">AUDIT PROOF: Third-Party Assurance  •  BRSR Reasonable Assurance  •  S-A-M-R ROI</div>
    <div class="timestamp">{{ date_str }}</div>
  </div>
</body>
</html>
