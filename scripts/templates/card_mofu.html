<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    .brand-pill { background-color: var(--mofu-color); box-shadow: 0 0 25px var(--mofu-glow); }
    .stage-badge { color: var(--mofu-badge); }
    .card-box { border-color: var(--mofu-badge); box-shadow: 0 0 35px var(--mofu-glow); }
    .card-tag { color: var(--mofu-badge); }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="brand-pill">ECOPULSE</div>
    <div class="stage-badge">MIDDLE OF FUNNEL | ENGINEERING TELEMETRY DEEP DIVE</div>
  </div>

  <div class="title-container">
    <h1 class="main-title">{{ headline }}</h1>
  </div>

  <div class="card-box">
    <div class="card-tag">MIDDLE OF FUNNEL  |  TECHNICAL BENCHMARK & METHODOLOGY</div>
    <p class="card-fact">{{ fact_text }}</p>
  </div>

  <div class="footer-bar">
    <div class="frameworks">BENCHMARKS: ISO 14040/44 LCA  •  Sensor Telemetry  •  Scope 1-3 Activity Data</div>
    <div class="timestamp">{{ date_str }}</div>
  </div>
</body>
</html>
